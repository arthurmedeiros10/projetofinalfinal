<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="style.css" rel="stylesheet">
    <title>Carrinho</title>
</head>
<body>
    <header>
        <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
            <div class="container-fluid justify-content-center">
                <a class="navbar-brand" href="#"><img src="logo.png" height="120" alt=""></a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse flex-grow-0 justify-content-center" id="navbarNav">
                    <ul class="navbar-nav text-center">
                        <li class="nav-item"><a class="nav-link" href="index.html">PRODUTOS</a></li>
                        <li class="nav-item active"><a class="nav-link" href="carrinho.html">CARRINHO</a></li>
                        <li class="nav-item" id="nav-login"><a class="nav-link" href="login.html">LOGIN</a></li>
                    </ul>
                    <div class="dropdown m-3">
                        <button id="user-info" class="btn btn-light dropdown-toggle" type="button" data-bs-toggle="dropdown" style="display:none">Opções</button>
                        <ul class="dropdown-menu">
                            <li><a class="dropdown-item" href="cadastro.html">Perfil</a></li>
                            <li><hr class="dropdown-divider"></li>
                            <li><a class="dropdown-item" href="#" onclick="logout()">Sair</a></li>
                        </ul>
                    </div>
                </div>
            </div>
        </nav>
    </header>

    <main class="d-flex justify-content-center" style="align-items:flex-start !important;">
        <div class="container-fluid" style="max-width:900px; margin:40px auto;">
            <h1 style="color:var(--primary-dark); font-weight:700; text-align:center; margin-bottom:24px;">Meu Carrinho</h1>

            <div id="lista-carrinho"></div>

            <div id="resumo" style="display:none; margin-top:20px; padding:18px; background:#fff; border-radius:var(--radius); box-shadow:var(--shadow-sm);">
                <div style="display:flex; justify-content:space-between; font-size:1.1rem; margin-bottom:6px;">
                    <span>Quantidade de itens:</span>
                    <strong id="total-itens">0</strong>
                </div>
                <div style="display:flex; justify-content:space-between; font-size:1.3rem; color:var(--accent-dark);">
                    <span>Total:</span>
                    <strong id="total-preco">R$ 0,00</strong>
                </div>
            </div>

            <div style="display:flex; gap:10px; flex-wrap:wrap; margin-top:20px;">
                <button class="btn_enviar" style="flex:1; min-width:180px; margin-top:0;" onclick="finalizarCompra()" id="btn-finalizar">Finalizar Compra</button>
                <button class="btn_enviar" style="flex:1; min-width:180px; margin-top:0; background:linear-gradient(135deg,#6b7280,#4b5563);" onclick="limparCarrinho()">Limpar Carrinho</button>
            </div>

            <div style="text-align:center; margin-top:20px;">
                <a href="index.html" style="color:var(--primary-dark); font-weight:600; text-decoration:none;">← Continuar comprando</a>
            </div>
        </div>
    </main>

    <div class="position-fixed" style="top:50%; left:50%; transform:translate(-50%,-50%); z-index:1050;">
        <div id="liveToast" class="toast align-items-center text-white bg-success border-0" role="alert" data-bs-delay="5000">
            <div class="d-flex">
                <div class="toast-body" id="toast-message">Mensagem</div>
                <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="./pages.js"></script>
    <script>
        function lerCarrinho() {
            try { return JSON.parse(localStorage.getItem("carrinho") || "[]"); } 
            catch { return []; }
        }

        function salvarCarrinho(carrinho) {
            localStorage.setItem("carrinho", JSON.stringify(carrinho));
        }

        function formatarPreco(valor) {
            return Number(valor || 0).toLocaleString("pt-BR", { style: "currency", currency: "BRL" });
        }

        function carregarCarrinho() {
            const carrinho = lerCarrinho();
            const lista = document.getElementById("lista-carrinho");
            const resumo = document.getElementById("resumo");

            if (!lista) return;

            if (carrinho.length === 0) {
                lista.innerHTML = `
                    <div style="text-align:center; padding:40px; background:#fff; border-radius:var(--radius); box-shadow:var(--shadow-sm);">
                        <p style="font-size:1.2rem; color:var(--text-muted); margin-bottom:16px;">🛒 Seu carrinho está vazio</p>
                        <a href="index.html" class="btn_enviar" style="display:inline-block; width:auto; padding:12px 24px; text-decoration:none;">Ver Produtos</a>
                    </div>`;
                if (resumo) resumo.style.display = "none";
                return;
            }

            lista.innerHTML = carrinho.map(item => `
                <div class="card" style="display:flex; flex-direction:row; align-items:center; justify-content:space-between; gap:12px; margin-bottom:12px; flex-wrap:wrap;">
                    <div style="flex:1; min-width:180px;">
                        <strong style="color:var(--primary-dark);">${item.nome}</strong>
                        ${item.preco ? `<div style="color:var(--text-muted); font-size:0.9rem;">${formatarPreco(item.preco)}</div>` : ""}
                    </div>
                    <div style="display:flex; align-items:center; gap:8px;">
                        <button class="btn_enviar" style="width:38px; padding:8px; margin:0;" onclick="alterarQtd(${item.id}, -1)">−</button>
                        <span style="min-width:24px; text-align:center; font-weight:700;">${item.quantidade}</span>
                        <button class="btn_enviar" style="width:38px; padding:8px; margin:0;" onclick="alterarQtd(${item.id}, 1)">+</button>
                        <button class="btn_enviar" style="width:auto; padding:8px 14px; margin:0; background:linear-gradient(135deg,#ef4444,#dc2626);" onclick="removerItem(${item.id})">Remover</button>
                    </div>
                </div>
            `).join("");

            const totalItens = carrinho.reduce((s, i) => s + i.quantidade, 0);
            const totalPreco = carrinho.reduce((s, i) => s + (Number(i.preco) || 0) * i.quantidade, 0);

            if (resumo) {
                resumo.style.display = "block";
                document.getElementById("total-itens").textContent = totalItens;
                document.getElementById("total-preco").textContent = formatarPreco(totalPreco);
            }
        }

        function alterarQtd(id, delta) {
            const carrinho = lerCarrinho();
            const item = carrinho.find(i => i.id === id);
            if (!item) return;
            item.quantidade += delta;
            const novo = item.quantidade <= 0 ? carrinho.filter(i => i.id !== id) : carrinho;
            salvarCarrinho(novo);
            carregarCarrinho();
        }

        function removerItem(id) {
            salvarCarrinho(lerCarrinho().filter(i => i.id !== id));
            carregarCarrinho();
        }

        function limparCarrinho() {
            salvarCarrinho([]);
            carregarCarrinho();
            if (typeof mostrarToast === "function") mostrarToast("🗑️ Carrinho esvaziado!", "bg-success");
        }

        async function finalizarCompra() {
            const carrinho = lerCarrinho();
            if (carrinho.length === 0) {
                if (typeof mostrarToast === "function") mostrarToast("❌ Carrinho vazio!", "bg-danger");
                return;
            }
            
            const token = localStorage.getItem("token");
            if (!token) {
                if (typeof mostrarToast === "function") mostrarToast("❌ Faça login para finalizar a compra!", "bg-danger");
                setTimeout(() => window.location.href = "login.html", 1500);
                return;
            }

            const btn = document.getElementById("btn-finalizar");
            btn.disabled = true;
            btn.innerText = "Processando...";

            try {
                const resposta = await fetch("http://localhost:3000/compra", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                        "Authorization": "Bearer " + token
                    },
                    body: JSON.stringify({ itens: carrinho })
                });

                const contentType = resposta.headers.get("content-type");
                if (!contentType || !contentType.includes("application/json")) {
                    throw new Error("Erro no servidor. A rota /compra existe?");
                }

                const json = await resposta.json();

                if (!resposta.ok) {
                    if (resposta.status === 401 || resposta.status === 403) {
                        if (typeof mostrarToast === "function") mostrarToast("❌ Sessão expirada. Faça login novamente.", "bg-danger");
                        localStorage.removeItem("token");
                        localStorage.removeItem("nome_cliente");
                        setTimeout(() => window.location.href = "login.html", 2000);
                        return;
                    }
                    throw new Error(json.erro || json.msg || "Erro ao processar compra");
                }

                if (typeof mostrarToast === "function") mostrarToast("✅ Compra finalizada com sucesso!", "bg-success");
                salvarCarrinho([]);
                carregarCarrinho();

            } catch (error) {
                console.error(error);
                if (typeof mostrarToast === "function") mostrarToast("❌ " + error.message, "bg-danger");
            } finally {
                btn.disabled = false;
                btn.innerText = "Finalizar Compra";
            }
        }

        window.alterarQtd = alterarQtd;
        window.removerItem = removerItem;
        window.limparCarrinho = limparCarrinho;
        window.finalizarCompra = finalizarCompra;

        document.addEventListener("DOMContentLoaded", carregarCarrinho);
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="style.css" rel="stylesheet">
    <title>Produtos</title>
</head>
<body>
    <header>
        <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
            <div class="container-fluid justify-content-center">
                <a class="navbar-brand" href="#"><img src="logo.png" height="120" alt=""></a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse flex-grow-0 justify-content-center" id="navbarNav">
                    <ul class="navbar-nav text-center">
                        <li class="nav-item active"><a class="nav-link" href="index.html">PRODUTOS</a></li>
                        <li class="nav-item"><a class="nav-link" href="carrinho.html">CARRINHO</a></li>
                        <li class="nav-item" id="nav-login"><a class="nav-link" href="login.html">LOGIN</a></li>
                    </ul>
                    <div class="dropdown m-3">
                        <button id="user-info" class="btn btn-light dropdown-toggle" type="button" data-bs-toggle="dropdown" style="display:none">Opções</button>
                        <ul class="dropdown-menu">
                            <li><a class="dropdown-item" href="cadastro.html">Perfil</a></li>
                            <li><hr class="dropdown-divider"></li>
                            <li><a class="dropdown-item" href="#" onclick="logout()">Sair</a></li>
                        </ul>
                    </div>
                </div>
            </div>
        </nav>
    </header>

    <main class="d-flex justify-content-center align-items-center" style="align-items:flex-start !important;">
        <div class="container-fluid">
            <div class="d-flex justify-content-between align-items-center mb-3" style="max-width:1200px; margin:0 auto;">
                <h1 style="color:var(--primary-dark); font-weight:700;">Nossos Produtos</h1>
                <span id="contador-produtos" class="badge" style="background:var(--accent); font-size:0.9rem; padding:8px 14px; border-radius:20px;">0 itens</span>
            </div>

            <form id="form-filtros" style="max-width:1200px; margin:0 auto 24px; padding:20px; background:#fff; border-radius:var(--radius); box-shadow:var(--shadow-sm); display:grid; grid-template-columns: 2fr 1.2fr 1fr 1fr 1.2fr auto; gap:12px; align-items:end;">
                <div>
                    <label for="filtro-busca">Buscar por nome</label>
                    <input type="text" id="filtro-busca" class="input_texto" placeholder="Ex: ração..." style="margin-bottom:0;">
                </div>
                <div>
                    <label for="filtro-categoria">Categoria</label>
                    <select id="filtro-categoria" class="input_texto" style="margin-bottom:0;">
                        <option value="">Todas</option>
                        <option value="Alimentação">Alimentação</option>
                        <option value="Móveis">Móveis</option>
                        <option value="Higiene">Higiene</option>
                        <option value="Acessórios">Acessórios</option>
                        <option value="Brinquedos">Brinquedos</option>
                        <option value="Conforto">Conforto</option>
                    </select>
                </div>
                <div>
                    <label for="filtro-preco-min">Preço mín. (R$)</label>
                    <input type="number" id="filtro-preco-min" class="input_texto" min="0" step="0.01" placeholder="0" style="margin-bottom:0;">
                </div>
                <div>
                    <label for="filtro-preco-max">Preço máx. (R$)</label>
                    <input type="number" id="filtro-preco-max" class="input_texto" min="0" step="0.01" placeholder="9999" style="margin-bottom:0;">
                </div>
                <div>
                    <label for="filtro-ordenacao">Ordenar por</label>
                    <select id="filtro-ordenacao" class="input_texto" style="margin-bottom:0;">
                        <option value="">Relevância</option>
                        <option value="asc">Menor preço</option>
                        <option value="desc">Maior preço</option>
                    </select>
                </div>
                <div style="display:flex; gap:8px;">
                    <button type="submit" class="btn_enviar" style="margin-top:0; padding:12px 16px;">🔍 Filtrar</button>
                    <button type="button" id="btn-limpar" class="btn_enviar" style="margin-top:0; padding:12px 16px; background:linear-gradient(135deg,#6b7280,#4b5563);">Limpar</button>
                </div>
            </form>

            <div id="loading" class="text-center py-5">
                <div class="spinner-border" style="color:var(--primary);" role="status">
                    <span class="visually-hidden">Carregando...</span>
                </div>
                <p class="mt-3" style="color:var(--text-muted);">Buscando produtos...</p>
            </div>

            <div id="grid-produtos" class="grid-produtos"></div>

        </div>
    </main>

    <div class="position-fixed" style="top:50%; left:50%; transform:translate(-50%,-50%); z-index:1050;">
        <div id="liveToast" class="toast align-items-center text-white bg-success border-0" role="alert" data-bs-delay="5000">
            <div class="d-flex">
                <div class="toast-body" id="toast-message">Mensagem</div>
                <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>
            </div>
        </div>
    </div>

    <footer></footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="./pages.js"></script>
    <script src="./produtos.js"></script>
</body>
</html>
